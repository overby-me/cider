# Nix CI for darling-nix
#
# This workflow builds the Darling package with Nix, runs flake checks,
# and executes integration tests.  It uses Cachix to cache build artifacts
# so that subsequent runs (and contributor builds) are fast.
#
# See: plan/08-phase6-ci.md (Task 6.3)

name: Nix CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "plan/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "plan/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Flake check ───────────────────────────────────────────────────────────
  # Fast: evaluates the flake, checks formatting, runs lightweight checks.
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: darling-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true # Don't fail if Cachix isn't configured

      - name: nix flake check (eval only)
        run: nix flake check --no-build --all-systems 2>&1

  # ── Build packages ────────────────────────────────────────────────────────
  # Builds the main Darling package and the SDK output.
  build:
    runs-on: ubuntu-latest
    needs: flake-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: darling-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      - name: Build Darling
        run: nix build .#darling -L --no-link --print-out-paths

      - name: Build Darling SDK
        run: nix build .#darling-sdk -L --no-link --print-out-paths

  # ── DevShell evaluation ───────────────────────────────────────────────────
  # Ensures the devShell evaluates without error so contributors can always
  # `nix develop`.  This is cheap (eval-only, no build).
  devshell:
    runs-on: ubuntu-latest
    needs: flake-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: darling-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      - name: Evaluate devShell
        run: nix eval .#devShells.x86_64-linux.default.name 2>&1

      - name: Build devShell
        run: nix build .#devShells.x86_64-linux.default -L --no-link --print-out-paths

  # ── Smoke test ────────────────────────────────────────────────────────────
  # If the build succeeds, run a quick smoke test to verify Darling starts
  # and the sandbox-exec stub is present.
  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: darling-nix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        continue-on-error: true

      - name: Build Darling
        id: build
        run: |
          out=$(nix build .#darling -L --no-link --print-out-paths)
          echo "darling=$out" >> "$GITHUB_OUTPUT"

      - name: Verify Darling binary exists
        run: |
          test -x "${{ steps.build.outputs.darling }}/bin/darling"
          echo "✓ darling binary found"

      - name: Check sandbox-exec stub is installed
        run: |
          test -f "${{ steps.build.outputs.darling }}/libexec/darling/usr/bin/sandbox-exec"
          echo "✓ sandbox-exec stub found"

      - name: Check diskutil supports info verb
        run: |
          grep -q 'info' "${{ steps.build.outputs.darling }}/libexec/darling/usr/sbin/diskutil"
          echo "✓ diskutil info verb found"

      # The following tests require actually running Darling, which needs
      # user namespaces and overlayfs — these may not be available in all
      # GitHub Actions runners.  We attempt them but allow failure.
      - name: Test darling shell (may need user namespaces)
        run: |
          timeout 30 "${{ steps.build.outputs.darling }}/bin/darling" shell echo "Hello from Darling" || {
            echo "::warning::darling shell failed — runner may lack user namespace support"
            exit 0
          }
        continue-on-error: true

      - name: Test sandbox-exec stub inside Darling
        run: |
          timeout 30 "${{ steps.build.outputs.darling }}/bin/darling" shell \
            /usr/bin/sandbox-exec -f /dev/null -D _GLOBAL_TMP_DIR=/tmp /bin/echo "sandbox-exec works" || {
            echo "::warning::sandbox-exec test failed — darling shell may not be functional on this runner"
            exit 0
          }
        continue-on-error: true

      - name: Test diskutil info inside Darling
        run: |
          timeout 30 "${{ steps.build.outputs.darling }}/bin/darling" shell \
            /usr/sbin/diskutil info / || {
            echo "::warning::diskutil info test failed — darling shell may not be functional on this runner"
            exit 0
          }
        continue-on-error: true
