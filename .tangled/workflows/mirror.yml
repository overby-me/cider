# Mirror main to github.com/overby-me/cider.
#
# THE MIRROR IS NOT A COPY OF THIS HISTORY, and that is deliberate. This repository begins with 569
# commits of upstream Darling, by Ariel Abreu, Lubos Dolezel and others, that predate any Cider work.
# The mirror starts at the first commit of this project instead, so the published history is the
# work rather than the inheritance.
#
# That means a plain push cannot work: the rewritten commits have different identifiers, so the two
# histories never fast forward onto one another. The rewrite is redone here on every run and the
# result is force pushed. git filter-repo is deterministic, so the same input commits produce the
# same output commits and the mirror stays stable rather than churning.
#
# WHAT THIS NEEDS THAT A WORKFLOW CANNOT PROVIDE: a GitHub token with push rights, added as the
# repository secret GITHUB_MIRROR_TOKEN in the tangled settings. Without it the job fails on its
# first step and says so rather than pushing nothing quietly.
when:
  - event: ["push"]
    branch: ["main"]

engine: microvm
image: nixos

# THE DEPTH BELOW IS IGNORED, which is not a guess: the first run of this file logged its own clone
# command as `git fetch --depth=1 --recurse-submodules=yes --tags`, with the 0 nowhere in it. Depth
# is a plain int whose documented default is 1, so an explicit 0 cannot be told apart from a field
# that was never set. It stays because 0 is what a full clone is spelled as if that is ever fixed,
# and the fetch step below is what actually makes the history complete.
#
# Submodules are turned off because they are pure cost here: they are fetched by default, they took
# over four minutes of the first run, and rewriting the superproject never looks inside one.
clone:
  depth: 0
  submodules: false

dependencies:
  - git
  - git-filter-repo

environment:
  MIRROR_REPO: github.com/overby-me/cider
  # The first commit of this project. Everything before it is upstream Darling and is not published.
  GRAFT_ROOT: c90dc7f99

steps:
  - name: "Check the token is present"
    command: |
      if [ -z "$GITHUB_MIRROR_TOKEN" ]; then
        echo "GITHUB_MIRROR_TOKEN is not set; add it as a repository secret in the tangled settings"
        exit 1
      fi

  - name: "Fetch the whole history"
    command: |
      # A shallow clone cannot be rewritten, and this one is shallow unless the depth above was
      # honoured. Unshallowing a complete repository is an error, so it is guarded on the marker.
      if [ -f .git/shallow ]; then
        git fetch --unshallow
      fi
      # THE CHECK THAT CANNOT LIE. An abbreviated hash only resolves if the object is actually
      # present, so this fails loudly on a truncated history rather than mirroring one.
      git cat-file -e "${GRAFT_ROOT}^{commit}"

  - name: "Rewrite so the first commit is the first commit of this project"
    command: |
      git replace --graft "$GRAFT_ROOT"
      # --force because this is a working clone with a remote, which filter-repo refuses by default.
      git filter-repo --force --quiet
      echo "root commit after rewrite:"
      git log --oneline | tail -1

  - name: "Push to GitHub"
    command: |
      # No tags and no other branches: the mirror publishes one line of work.
      git tag -d $(git tag) 2>/dev/null || true
      # The token is in the URL rather than a config file so it is never written to disk.
      git push --force "https://x-access-token:${GITHUB_MIRROR_TOKEN}@${MIRROR_REPO}.git" \
        HEAD:refs/heads/main 2>&1 | sed -e "s/${GITHUB_MIRROR_TOKEN}/REDACTED/g"
