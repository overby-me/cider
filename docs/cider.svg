<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cider: a glass of cider, in the spirit of the Wine project's wineglass.

  Wine puts a single stemmed glass on a plain field, readable as a silhouette at any size.
  This keeps that idea and changes the drink: a tulip glass of amber cider, with the apple
  it is pressed from carried in the negative space of the liquid rather than sitting beside
  the glass as a second object.

  Drawn to survive being small. At 16 px the outline, the amber body and the leaf still read;
  the bubbles and the highlight drop out gracefully because they are low contrast by design.
  No gradients on the silhouette itself, so it also works as a single-colour mask.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-labelledby="title desc">
  <title id="title">Cider</title>
  <desc id="desc">A tulip glass of amber cider, with an apple silhouette in the liquid.</desc>

  <defs>
    <linearGradient id="cider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F6B23C"/>
      <stop offset="0.55" stop-color="#E08A1E"/>
      <stop offset="1"   stop-color="#C06A10"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <!-- The liquid is clipped to the inside of the bowl, so the apple and the bubbles
         cannot leak past the glass wall no matter how they are drawn. -->
    <clipPath id="bowl">
      <path d="M74 44 h108 c0 46 -8 74 -22 92 c-9 12 -20 19 -32 22 c-12 -3 -23 -10 -32 -22
               c-14 -18 -22 -46 -22 -92 z"/>
    </clipPath>
  </defs>

  <!-- LIQUID. The surface sits below the rim, which is what makes it read as a drink
       rather than as a solid shape. -->
  <g clip-path="url(#bowl)">
    <rect x="70" y="58" width="116" height="128" fill="url(#cider)"/>

    <!-- The apple, in negative space: darker liquid, not an outline, so it stays legible
         when the whole mark is reduced to one colour. -->
    <g fill="#A2540B" opacity="0.55">
      <path d="M128 104 c-8 -6 -19 -5 -23 3 c-5 9 -3 22 5 32 c4 5 9 9 13 9 c2 0 3 -1 5 -2
               c2 1 3 2 5 2 c4 0 9 -4 13 -9 c8 -10 10 -23 5 -32 c-4 -8 -15 -9 -23 -3 z"/>
      <path d="M128 104 c1 -6 4 -10 10 -13 c-2 6 -4 10 -10 13 z"/>
    </g>

    <!-- Bubbles: three, rising, unevenly spaced. Even spacing reads as a pattern. -->
    <g fill="#FFF3D6" opacity="0.75">
      <circle cx="104" cy="150" r="4"/>
      <circle cx="150" cy="128" r="3"/>
      <circle cx="115" cy="112" r="2.2"/>
    </g>

    <!-- The meniscus: a light line where the liquid meets the glass. -->
    <rect x="70" y="58" width="116" height="3" fill="#FFE1A3" opacity="0.85"/>
  </g>

  <!-- GLASS. One continuous stroke for bowl, stem and foot, so the mark holds together
       as a silhouette. -->
  <g fill="none" stroke="#2B2118" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 44 h108 c0 46 -8 74 -22 92 c-9 12 -20 19 -32 22 c-12 -3 -23 -10 -32 -22
             c-14 -18 -22 -46 -22 -92 z"/>
    <path d="M128 158 v44"/>
    <path d="M96 210 h64"/>
  </g>

  <!-- Highlight, last so it sits over the liquid: the curve of the near wall. -->
  <path d="M88 52 c0 40 6 63 17 79" fill="none" stroke="url(#glass)" stroke-width="9"
        stroke-linecap="round"/>
</svg>
