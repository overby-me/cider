# cider-graph-specs: the Rust rewrite of scripts/buck-graph-to-specs.py and its shared half
# scripts/buck_lowering.py, task #99.
#
# BUILT BY NIX, NOT BY BUCK2. It runs inside the graph derivation, which is the tree buck2 was
# just run on, so buck2 building it would be circular. Same route as nix/skeleton.nix.
#
# serde_json WITH preserve_order, and both halves of that are load bearing. The generator reads a
# 147 MB graph.json and writes JSON whose OBJECT KEY ORDER IS PART OF THE OUTPUT: python dicts
# are insertion ordered and json.dump writes them in that order, so a serialiser that sorted or
# reordered keys would produce a correct-looking tree with a different hash, which throws away
# the content addressing this port depends on. Hand rolling a parser for 147 MB of JSON was the
# alternative and was rejected: it is exactly the kind of code that is subtly wrong.
[package]
name = "cider-graph-specs"
version = "0.0.0"
edition = "2021"
publish = false

# FOUR BINARIES, ONE CRATE, so src/pyjson.rs and src/sha256.rs are SHARED rather than copied. Both tools have to
# write python-compatible JSON, and a second copy of that serialiser is exactly the drift risk
# this port has been careful about everywhere else: the two would diverge and one output would
# silently stop matching. autobins is off so the set is explicit rather than discovered.
autobins = false

[[bin]]
name = "cider-graph-specs"
path = "src/main.rs"

[[bin]]
name = "cider-graph-sources"
path = "src/sources.rs"

# THE THIRD BINARY, and the one that PRODUCES what the other two read. It shares pyjson (the
# python compatible JSON writer), pat, pypath and sha256 with them, which is the whole reason it
# is a binary of this crate rather than a crate of its own.
[[bin]]
name = "cider-graph-dump"
path = "src/dump.rs"

# THE FOURTH BINARY, the Rust rewrite of scripts/buck-graph-equiv.py (#98). It is in this crate
# because it reads the same graph.json and shares sha256 with the dump and the sources pass; a
# crate of its own would mean a second copy of that hash.
[[bin]]
name = "cider-graph-equiv"
path = "src/equiv.rs"

# THE FIFTH BINARY, the Rust rewrite of scripts/buck-codegen-closure.py (#98). Same reason as
# the fourth: it is a hash join over the graph, and it shares the farm table reader.
[[bin]]
name = "cider-codegen-closure"
path = "src/closure.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
