# cider-src-normalise: the vendor/src symlink normaliser, moved off Python (#99).
#
# BUILT BY NIX, NOT BY BUCK2, and that is a hard constraint rather than a preference: this tool
# prepares the tree buck2 is then run on, so building it with buck2 would be circular. Same
# shape as linux/buildtools/skeleton and linux/buildtools/graph-specs.
#
# STD ONLY, NO DEPENDENCIES, so Cargo.lock holds one package and nothing has to be vendored.
# It runs once per pin on the local path and once per assembled tree in the graph derivation,
# which is early enough that a dependency fetch would sit between an edit and the first compile.
[package]
name = "cider-src-normalise"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "cider-src-normalise"
path = "src/main.rs"

[profile.release]
# IO bound, like the skeletoniser: the work is readdir, readlink and symlink, not computation.
opt-level = 2
