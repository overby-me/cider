# launcher -- Rust rewrite of the cider launcher (binary: cider; was src/startup/cider.c, task #64).
#
# The `cider` launcher: userns re-exec (rootless), prefix bootstrap, spawn/join/
# teardown of ciderd-as-container-init, readiness coordination, and the
# shellspawn client that proxies one shell/binary into the guest. It does NO mounts
# or vchroot -- ciderd (already Rust) owns those. Raw libc only (matches the
# server crate style, no nix dep), so it builds offline from the cached registry.
[package]
name = "launcher"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "cider"
path = "src/main.rs"

[dependencies]
# Pin to the exact version already vendored by the server crate so `cargo build
# --offline` resolves from ~/.cargo without a fetch.
libc = "=0.2.189"
