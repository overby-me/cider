# darling-launcher-rs -- Rust rewrite of src/startup/darling.c (task #64).
#
# The `darling` launcher: userns re-exec (rootless), prefix bootstrap, spawn/join/
# teardown of darlingserver-as-container-init, readiness coordination, and the
# shellspawn client that proxies one shell/binary into the guest. It does NO mounts
# or vchroot -- darlingserver (already Rust) owns those. Raw libc only (matches the
# darlingserver-rs style, no nix dep), so it builds offline from the cached registry.
[package]
name = "darling-launcher-rs"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "darling"
path = "src/main.rs"

[dependencies]
# Pin to the exact version already vendored by darlingserver-rs so `cargo build
# --offline` resolves from ~/.cargo without a fetch.
libc = "=0.2.189"
