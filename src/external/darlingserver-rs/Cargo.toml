# darlingserver-rs -- Rust host-side rewrite of darlingserver (Stage 0 onward).
# See plan/rust-rewrite-eval.md (plan) + plan/rust-spike-stage3.md (the make-or-break
# spike). Stage 0: bindgen the real dtape hooks contract + link the prebuilt
# duct-tape static lib and call the real dtape_init(&hooks). The prior end-to-end
# link-model proof (stub duct-tape) lives in prototype/rust-consume-model/.
[package]
name = "darlingserver-rs"
version = "0.0.0"
edition = "2021"
publish = false

# Stage 0 deliverable: prove the real duct-tape links and dtape_init is callable.
[[bin]]
name = "dtape-link-proof"
path = "src/main.rs"

[build-dependencies]
bindgen = "0.69"
cc = "1"
